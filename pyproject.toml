[project]
name = "transcrb"
version = "0.1.0"
description = "Local private EN/HE meeting transcription"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.0.3",
    "pyannote.audio>=3.1",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "soundfile>=0.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Both top-level packages are ours; name them so setuptools does not have to
# guess (flat-layout auto-discovery refuses when it finds more than one).
[tool.setuptools]
packages = ["engine", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
