<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRANSCRB</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    main.main{padding:22px;max-width:820px;margin:0 auto}
    .panel{background:var(--paper);padding:16px;margin-bottom:16px}
    .panel h2{font-family:var(--mono);font-size:12px;letter-spacing:2px;
      text-transform:uppercase;color:var(--muted);margin:0 0 12px}
    .drop{border:2px dashed var(--line);border-radius:var(--r);padding:32px;
      text-align:center;color:var(--muted);cursor:pointer}
    .drop.hover{background:var(--sel);border-color:var(--accent)}
    .row{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}
    label{font-size:13px}
    button{font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:8px 16px;
      cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
    button:active{box-shadow:inset -1px -1px var(--bevel-lt),inset 1px 1px var(--bevel-dk)}
    #status{font-family:var(--mono);font-size:12px;color:var(--accent);min-height:18px}
    #result{white-space:pre-wrap;font-family:var(--mono);font-size:13px;
      background:var(--paper);padding:12px;max-height:50vh;overflow:auto}
    [dir=auto]{unicode-bidi:plaintext}
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="mark"></div>
    <span class="word">TRANSCRB</span>
    <span class="pipe">|</span>
    <span class="appname">LOCAL TRANSCRIPTION</span>
    <span class="spacer"></span>
  </header>
  <div class="statusbar"><span>100% local · nothing leaves this machine</span></div>
  <main class="main">
    <div class="panel">
      <h2>Transcribe a file</h2>
      <div id="drop" class="drop">Drop audio here, or click to choose</div>
      <input id="file" type="file" accept="audio/*,video/*" hidden>
      <div class="row">
        <label>Language:
          <select id="lang">
            <option value="">Auto-detect</option>
            <option value="he">Hebrew</option>
            <option value="en">English</option>
          </select>
        </label>
        <label><input id="diarize" type="checkbox" checked> Label speakers</label>
        <button id="go">Transcribe</button>
      </div>
      <div id="status"></div>
    </div>
    <div class="panel">
      <h2>Record (mic / system audio)</h2>
      <div class="row"><button id="rec" disabled>Record — set up in first-time setup</button></div>
    </div>
    <div class="panel">
      <h2>Result</h2>
      <div class="row">
        <button id="copy">Copy</button>
        <a id="dl" download="transcript.md"><button>Download .md</button></a>
      </div>
      <div id="result" dir="auto">—</div>
    </div>
  </main>
  <script>
    const $ = s => document.querySelector(s);
    let chosen = null;
    const drop = $("#drop"), fileInput = $("#file");
    drop.onclick = () => fileInput.click();
    fileInput.onchange = e => { chosen = e.target.files[0]; drop.textContent = chosen.name; };
    ["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add("hover"); }));
    ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.remove("hover"); }));
    drop.addEventListener("drop", e => { chosen = e.dataTransfer.files[0]; drop.textContent = chosen.name; });

    $("#go").onclick = async () => {
      if (!chosen) { $("#status").textContent = "Choose a file first."; return; }
      const fd = new FormData();
      fd.append("file", chosen);
      fd.append("lang", $("#lang").value);
      fd.append("diarize", $("#diarize").checked ? "true" : "false");
      $("#status").textContent = "Working… (this can take a while for long meetings)";
      try {
        const r = await fetch("/api/transcribe", { method: "POST", body: fd });
        if (!r.ok) throw new Error(await r.text());
        const j = await r.json();
        const md = await (await fetch("/api/file?path=" + encodeURIComponent(j.md))).text();
        $("#result").textContent = md;
        $("#dl").href = "data:text/markdown;charset=utf-8," + encodeURIComponent(md);
        $("#status").textContent = "Done → " + j.md;
      } catch (err) { $("#status").textContent = "Error: " + err.message; }
    };
    $("#copy").onclick = () => navigator.clipboard.writeText($("#result").textContent);
  </script>
</body>
</html>
